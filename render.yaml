services:
  - type: web
    name: salone4d-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: "staging"
      - key: RUN_MODE
        value: "all"
      - key: HOT_POST_TIME
        value: "10:00"
      - key: RESULT_POST_START_TIME
        value: "17:45"
